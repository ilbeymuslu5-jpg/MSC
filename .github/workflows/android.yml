name: Android build

# Play Store'a yüklenecek .aab burada üretilir.
# GitHub runner'larında Android SDK kurulu geldiği için ek kuruluma gerek yok.

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**']
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Sürüm adı (örn. 1.0.1)'
        required: false
      versionCode:
        description: 'Sürüm kodu (örn. 2)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Bağımlılıklar
        run: npm ci

      - name: Web varlıklarını derle
        run: npm run build:www

      - name: Capacitor senkronizasyonu
        run: npx cap sync android

      - name: Sürümü ayarla (elle tetiklendiyse)
        if: github.event_name == 'workflow_dispatch' && inputs.versionName != ''
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.versionName }}\"/" android/app/build.gradle
          if [ -n "${{ inputs.versionCode }}" ]; then
            sed -i "s/versionCode .*/versionCode ${{ inputs.versionCode }}/" android/app/build.gradle
          fi

      - name: İmzalama anahtarını yaz (secret tanımlıysa)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<PROPS
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: gradlew çalıştırılabilir olsun
        run: chmod +x android/gradlew

      - name: Debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Release AAB (Play Store paketi)
        run: cd android && ./gradlew --no-daemon bundleRelease

      - name: Release APK (doğrudan kurulum için)
        run: cd android && ./gradlew --no-daemon assembleRelease

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: msc-music-android
          retention-days: 30
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/release/*.apk
            app/android/app/build/outputs/apk/debug/*.apk
